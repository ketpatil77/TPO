<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TPO Officer Login - Placement Portal</title>
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container navbar-inner">
            <a href="/admin" class="brand">
                <div class="brand-icon">TPO</div>
                <div>
                    <div class="brand-title">Admin & TPO Officer Portal</div>
                    <div class="brand-subtitle">Training & Placement Cell</div>
                </div>
            </a>
            <span class="badge badge-info">Authorized staff</span>
        </div>
    </nav>

    <main class="auth-wrapper">
        <div class="glass-card auth-card">
            <div class="auth-header">
                <h2>TPO Officer Access</h2>
                <p>Sign in with your authorized TPO account</p>
            </div>

            <div id="alertBox" style="display: none;" class="form-group"></div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label class="form-label" for="email">Admin Email</label>
                    <input type="email" id="email" class="form-input" required autofocus autocomplete="username">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" required autocomplete="current-password" minlength="8">
                    <span class="form-hint">Use your authorized Supabase account password.</span>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
                    Sign in to admin workspace
                </button>
            </form>
        </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>

    <script src="/js/security.js"></script>
    <script src="/js/admin-login.js"></script>
</body>
</html>
