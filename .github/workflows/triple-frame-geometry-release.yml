name: Triple Frame Geometry Verified Release

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  verify-and-commit:
    if: github.head_ref == 'hotfix/triple-frame-clean-shimmer'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply fixed avatar geometry
        run: |
          node <<'NODE'
          const fs=require('fs');
          function update(path,fn){const before=fs.readFileSync(path,'utf8');const after=fn(before);if(after===before)throw new Error(`No change applied: ${path}`);fs.writeFileSync(path,after);}
          update('public/css/student-experience-v1.css',css=>{
            const anchor=`.student-avatar.rank-frame,\n.candidate-rank-avatar.rank-frame { position: relative; isolation: isolate; border: 3px solid transparent; box-shadow: var(--shadow-sm); transition: border-color var(--experience-transition), box-shadow var(--experience-transition); }`;
            if(!css.includes(anchor)) throw new Error('Rank-frame anchor missing');
            return css.replace(anchor,`${anchor}\n.student-avatar.rank-frame { width:64px; height:64px; min-width:64px; flex:0 0 64px; aspect-ratio:1 / 1; }`);
          });
          for(const path of ['public/index.html','public/dashboard.html','public/admin-dashboard.html','public/observer-dashboard.html']) update(path,html=>{
            if(!html.includes('20260906-engagement3')) throw new Error(`engagement3 missing in ${path}`);
            return html.replaceAll('20260906-engagement3','20260906-engagement4');
          });
          update('test/student-engagement-features.test.js',t=>{
            t=t.replaceAll('20260906-engagement3','20260906-engagement4');
            t += `\n\ntest('student rank frame keeps a fixed square avatar geometry', () => {\n  assert.match(css,/\\.student-avatar\\.rank-frame \\{[^}]*width:64px;[^}]*height:64px;[^}]*min-width:64px;[^}]*flex:0 0 64px;[^}]*aspect-ratio:1 \\/ 1;/);\n});\n`;
            return t;
          });
          NODE
      - name: Full test suite
        run: npm run check
      - name: Syntax check all application JavaScript
        run: find src worker public/js scripts test -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Cloudflare dry run
        run: npm run deploy:dry-run
      - name: Install Chromium
        run: npm install --no-save --package-lock=false playwright@1.55.0 && npx playwright install --with-deps chromium
      - name: Verify square clean shimmer on mobile and desktop
        run: |
          python3 -m http.server 4173 --directory public >/tmp/tpo-frame-http.log 2>&1 &
          cat > frame-geometry-evidence.mjs <<'NODE'
          import { chromium } from 'playwright'; import fs from 'node:fs';
          fs.mkdirSync('frame-geometry-evidence',{recursive:true});
          const browser=await chromium.launch({headless:true});
          for(const [name,width,height] of [['mobile',390,844],['desktop',1440,900]]){
            const context=await browser.newContext({viewport:{width,height},colorScheme:'dark'}); const page=await context.newPage();
            await page.setContent(`<!doctype html><html data-theme="dark"><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="http://127.0.0.1:4173/css/styles.css"><link rel="stylesheet" href="http://127.0.0.1:4173/css/portal-responsive.css"><link rel="stylesheet" href="http://127.0.0.1:4173/css/student-experience-v1.css?v=20260906-engagement4"></head><body class="student-dashboard-page"><div class="glass-card header-banner" style="margin:24px;max-width:760px"><div class="student-meta"><div id="studentAvatar" class="student-avatar rank-frame rank-frame-triple" data-triple="true"><span class="student-avatar-initial">KP</span></div><div class="student-info"><h2>KETAN VILAS PATIL</h2><p>Branch: CT • Class: BE-A • Year: Final Year</p><span class="experience-greeting">Triple #1 · College · Branch · Class</span></div></div></div></body></html>`,{waitUntil:'networkidle'});
            const audit=await page.evaluate(()=>{const a=document.getElementById('studentAvatar'),s=getComputedStyle(a),b=getComputedStyle(a,'::before'),af=getComputedStyle(a,'::after'),r=a.getBoundingClientRect();return{w:r.width,h:r.height,animation:s.animationName,transform:s.transform,before:b.content,after:af.content,overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth};});
            if(Math.abs(audit.w-audit.h)>1) throw new Error(`${name}: avatar not square ${audit.w}x${audit.h}`);
            if(audit.w<63||audit.w>71) throw new Error(`${name}: unexpected avatar size ${audit.w}`);
            if(audit.animation!=='rank-frame-shimmer') throw new Error(`${name}: shimmer missing`);
            if(audit.transform!=='none') throw new Error(`${name}: photo/avatar transform detected`);
            if(audit.before!=='none'||audit.after!=='none') throw new Error(`${name}: overlay pseudo detected`);
            if(audit.overflow>1) throw new Error(`${name}: horizontal overflow ${audit.overflow}`);
            await page.locator('.header-banner').screenshot({path:`frame-geometry-evidence/${name}.png`}); await context.close();
          }
          await browser.close();
          NODE
          node frame-geometry-evidence.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: triple-frame-geometry-evidence
          path: frame-geometry-evidence/*.png
      - name: Commit only after every gate passed
        run: |
          rm -f frame-geometry-evidence.mjs
          rm -rf frame-geometry-evidence
          git rm .github/workflows/triple-frame-geometry-release.yml
          git add public/css/student-experience-v1.css public/index.html public/dashboard.html public/admin-dashboard.html public/observer-dashboard.html test/student-engagement-features.test.js
          git config user.name "KET ⚡"
          git config user.email "ket.patil77@gmail.com"
          git commit -m "Lock triple-rank avatar geometry"
          git push origin HEAD:${{ github.head_ref }}
