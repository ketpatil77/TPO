name: Student Engagement Release Gate

on:
  push:
    branches: [feature/student-engagement-release]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/student-engagement-release
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply complete engagement release
        run: node scripts/apply-student-delight-release.cjs
      - name: Remove bootstrap-only release tooling
        run: git rm .github/workflows/student-engagement-release.yml scripts/apply-student-delight-release.cjs scripts/student-engagement-evidence.mjs
      - name: Install project dependencies
        run: npm ci
      - name: Full existing test suite
        run: npm run check | tee full-test-output.txt
      - name: Syntax check all application JavaScript
        run: find src worker public/js scripts test -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: WCAG contrast verification
        run: |
          node <<'NODE'
          const pairs=[['text heading','#f8fafc','#161b26',4.5],['body text','#cbd5e1','#161b26',4.5],['muted text','#94a3b8','#161b26',4.5],['gold frame','#f3c969','#161b26',3],['accent frame','#64748b','#161b26',3],['bronze base','#f59e0b','#161b26',3],['success tint','#10b981','#161b26',3],['danger accent','#ef4444','#161b26',3]];
          const c=x=>{x/=255;return x<=.04045?x/12.92:((x+.055)/1.055)**2.4}; const l=h=>{const [r,g,b]=[1,3,5].map(i=>c(parseInt(h.slice(i,i+2),16)));return .2126*r+.7152*g+.0722*b}; const ratio=(a,b)=>{const x=l(a),y=l(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
          for(const [name,fg,bg,min] of pairs){const value=ratio(fg,bg);console.log(`${name}: ${value.toFixed(2)}:1 (minimum ${min}:1)`);if(value<min)process.exitCode=1;}
          NODE
      - name: Cloudflare Worker dry run
        run: npm run deploy:dry-run
      - name: Install Chromium for real viewport evidence
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          git checkout -- package.json package-lock.json
      - name: Start local portal for screenshots
        run: |
          JWT_SECRET='test-secret-at-least-thirty-two-characters' NODE_ENV=test SUPABASE_URL='' SUPABASE_KEY='' PORT=3000 node src/server.js > ui-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:3000/api/health >/dev/null && exit 0; sleep 1; done
          cat ui-server.log
          exit 1
      - name: Capture real mobile tablet and desktop screenshots
        run: git show HEAD:scripts/student-engagement-evidence.mjs > /tmp/student-engagement-evidence.mjs && node /tmp/student-engagement-evidence.mjs
      - name: Upload screenshot and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: student-engagement-evidence
          path: |
            ui-evidence/*.png
            full-test-output.txt
            ui-server.log
          retention-days: 30
      - name: Commit only fully verified application changes
        run: |
          git add src public test
          git status --short
          git commit -m "feat: add student engagement experience"
          git push origin HEAD:feature/student-engagement-release
