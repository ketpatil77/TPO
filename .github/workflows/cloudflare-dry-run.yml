name: Cloudflare Dry Run

# Production rebuild trigger after CGPA editability + ranking verification fix.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full Cloudflare build gate
        run: npm run check
      - name: Syntax checks
        run: |
          node --check worker/index.mjs
          node --check src/server.js
          node --check src/routes/profileRankingView.js
          node --check src/routes/profileDeclarations.js
          node --check src/utils/profileCompletionModel.js
          node --check public/js/profile-ranking.js
          node --check public/js/portal-responsive.js
          node --check public/js/portal-back-guard.js
          node --check public/js/student-engagement-v2.js
          node --check public/js/profile-declarations-ui.js
          node --check public/js/tpc-layout-v2.js
          node --check public/js/dob-view-controls.js
      - name: Cloudflare dry run
        run: npm run deploy:dry-run
