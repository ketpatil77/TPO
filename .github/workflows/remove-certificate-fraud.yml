name: Remove certificate fraud subsystem
on:
  push:
    branches: [hotfix/remove-certificate-fraud]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/remove-certificate-fraud
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply isolated removal
        run: node .remove-certificate-fraud.cjs
      - name: Regenerate lockfile without fraud dependency
        run: npm install --package-lock-only
      - name: Install dependencies
        run: npm ci
      - name: Dependency security gate
        run: npm audit --audit-level=high
      - name: Full test suite
        run: npm test
      - name: Syntax check all application JavaScript
        run: find src worker public/js scripts test -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Assert certificate fraud runtime is gone
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE "certificateFraudDetection|FRAUD_RECOVERY_CRON|CERTIFICATE_FRAUD_QUEUE|fraud_processed_at|fraud_analysis_version|tpo-certificate-review|certificate_review_status|certificate_manual_audits|Certificate fraud|Fraud checks" src worker public --exclude='worker-configuration.d.ts'; then
            echo 'Certificate fraud references remain in runtime code.'
            exit 1
          fi
      - name: Cloudflare dry run
        run: npm run deploy:dry-run
      - name: Commit verified removal and remove gate
        run: |
          git config user.name 'KET ⚡'
          git config user.email 'ket.patil77@gmail.com'
          git rm -f .remove-certificate-fraud.cjs .github/workflows/remove-certificate-fraud.yml .tmp 2>/dev/null || true
          git add -A
          git commit -m 'Remove certificate fraud detection subsystem'
          git push origin hotfix/remove-certificate-fraud
