name: One-time rank push broadcast

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/one-time-rank-push.yml'

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deployment
        run: sleep 75
      - name: Deliver personalized ranking pushes in batches
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            echo "Batch $i"
            curl --fail --show-error --silent --max-time 60 \
              'https://ait.ait-placement-portal.workers.dev/api/internal/rank-push/deliver?job=rank-broadcast-20260902-1550'
            echo
            sleep 2
          done
