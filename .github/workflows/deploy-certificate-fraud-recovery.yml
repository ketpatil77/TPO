name: Deploy Certificate Fraud Recovery

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/deploy-certificate-fraud-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current master
        uses: actions/checkout@v7
        with:
          ref: master
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm run check
      - name: Cloudflare dry run
        run: npm run deploy:dry-run
      - name: Verify Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          npx wrangler whoami
      - name: Ensure certificate fraud queue exists
        run: npx wrangler queues create ait-certificate-fraud || true
      - name: Deploy current master
        run: npx wrangler deploy
