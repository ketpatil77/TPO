name: Research Proof Mute Hotfix

on:
  push:
    branches: [hotfix/research-proof-mute]

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v7
        with:
          ref: hotfix/research-proof-mute
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply research proof mute hotfix
        run: node .github/hotfix-research-proof-mute.cjs
      - name: Remove bootstrap tooling
        run: git rm .github/workflows/research-proof-mute-hotfix.yml .github/hotfix-research-proof-mute.cjs
      - name: Install dependencies
        run: npm ci
      - name: Full current test suite
        run: npm run check
      - name: Syntax check application JavaScript
        run: find src worker public/js test -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Cloudflare Worker dry run
        run: npm run deploy:dry-run
      - name: Commit verified hotfix
        run: |
          git config user.name "KET ⚡"
          git config user.email "ket.patil77@gmail.com"
          git add public/js/student-experience-v1.js src/routes/proofReview.js src/services/submissionRisk.js test/anti-cheat-duplicate-impersonation-v3.test.js test/proof-review-layout.test.js test/student-engagement-features.test.js
          git status --short
          git commit -m "fix: research proof mute regressions"
          git push origin HEAD:hotfix/research-proof-mute
