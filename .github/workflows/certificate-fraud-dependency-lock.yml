name: Certificate Fraud Dependency Lock

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/certificate-fraud-dependency-lock.yml'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify clean baseline install
        run: npm ci
      - name: Generate exact dependency lock
        run: npm install --package-lock-only --ignore-scripts --save-exact @cf-wasm/photon@0.4.0 tesseract.js@7.0.0
      - name: Verify generated lock installs
        run: npm ci
      - name: Run full test suite
        run: npm run check
      - name: Cloudflare dry run with dependencies
        run: npm run deploy:dry-run
      - name: Commit validated manifests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo 'Dependency manifests already exact.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'build: lock certificate fraud detection dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
