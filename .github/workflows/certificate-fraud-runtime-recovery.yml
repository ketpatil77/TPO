name: Certificate Fraud Runtime Recovery

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/certificate-fraud-runtime-recovery.yml'
      - '.github/runtime-recovery-hotfix.cjs'
      - 'src/services/certificateFraudDetection.js'
      - 'worker/index.mjs'
      - 'wrangler.jsonc'
      - 'test/certificate-fraud-detection.test.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply tested runtime recovery patch
        run: node .github/runtime-recovery-hotfix.cjs
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm run check
      - name: Syntax check all application JavaScript
        run: find src worker public/js scripts test -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Cloudflare dry run
        run: npm run deploy:dry-run
      - name: Commit tested recovery hotfix
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/certificate-fraud-runtime-recovery.yml .github/runtime-recovery-hotfix.cjs
          git rm -f .runtime-recovery-trigger .runtime-recovery-trigger2 || true
          git add src/services/certificateFraudDetection.js worker/index.mjs wrangler.jsonc test/certificate-fraud-detection.test.js
          git commit -m 'fix: add certificate fraud runtime recovery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
