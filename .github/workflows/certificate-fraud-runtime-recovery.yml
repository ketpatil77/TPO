name: Certificate Fraud Runtime Recovery

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/certificate-fraud-runtime-recovery.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply direct recovery hotfix
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/services/certificateFraudDetection.js')
          s=p.read_text()
          needle="async function processQueueBatch(batch){ for(const message of batch.messages||[]){ const id=message?.body?.certificateId; if(!id){message.ack?.();continue;} try{await processCertificate(id);message.ack?.();}catch(e){await failAnalysis(id,e).catch(()=>{});message.retry?.();} } }"
          insert=needle+"\nasync function processPendingCertificatesDirect(limit=2,{recognizer}={}){\n  const pending=(await db.select('certificates')).filter(c=>c.evidence_path && !c.fraud_processed_at).slice(0,Math.max(1,limit));\n  let processed=0, failed=0; const results=[];\n  for(const cert of pending){\n    try{ const result=await processCertificate(cert.id,{recognizer}); processed++; results.push({id:cert.id,status:'processed',review_status:result.review_status}); }\n    catch(error){ failed++; const message=await failAnalysis(cert.id,error); results.push({id:cert.id,status:'failed',error:message}); }\n  }\n  return {selected:pending.length,processed,failed,results};\n}"
          if 'processPendingCertificatesDirect' not in s:
              s=s.replace(needle,insert)
          s=s.replace('enqueuePendingCertificates,processQueueBatch,monthlyAuditSelected','enqueuePendingCertificates,processQueueBatch,processPendingCertificatesDirect,monthlyAuditSelected')
          p.write_text(s)

          p=Path('worker/index.mjs')
          s=p.read_text()
          old="            if (event.cron === (env.PROOF_EXPIRY_CRON || '0 * * * *')) { const { default: proofExpiry } = await import('../src/services/proofExpiry.js'); console.log('Proof expiry cleanup complete:', JSON.stringify(await proofExpiry.runProofExpiryCleanup())); const { default: fraud } = await import('../src/services/certificateFraudDetection.js'); console.log('Certificate fraud backlog enqueue complete:', JSON.stringify(await fraud.enqueuePendingCertificates(100))); }"
          new=old+"\n            if (event.cron === (env.FRAUD_RECOVERY_CRON || '*/5 * * * *')) { const { default: fraud } = await import('../src/services/certificateFraudDetection.js'); console.log('Certificate fraud direct recovery complete:', JSON.stringify(await fraud.processPendingCertificatesDirect(2))); }"
          if 'FRAUD_RECOVERY_CRON' not in s:
              s=s.replace(old,new)
          p.write_text(s)

          p=Path('wrangler.jsonc')
          s=p.read_text()
          if 'FRAUD_RECOVERY_CRON' not in s:
              s=s.replace('"MANUAL_AUDIT_CRON": "15 0 * * *"','"MANUAL_AUDIT_CRON": "15 0 * * *",\n    "FRAUD_RECOVERY_CRON": "*/5 * * * *"')
              s=s.replace('"15 0 * * *"]','"15 0 * * *", "*/5 * * * *"]')
          p.write_text(s)

          p=Path('test/certificate-fraud-detection.test.js')
          s=p.read_text()
          if 'direct recovery processes pending legacy certificate' not in s:
              s += r'''

test('direct recovery processes pending legacy certificate without queue dependency', async () => {
  const fraud = require('../src/services/certificateFraudDetection');
  const db = require('../src/config/database');
  const student = await db.insert('students', { prn:'RECOVERY-1', name:'Recovery Student', dob:'2000-01-01', branch:'CT', class:'Final Year', year:'Final Year' });
  const cert = await db.insert('certificates', { student_id:student.id, name:'Recovery Test', issuer:'AIT', date:'2026-09-06', evidence_path:'certificates/recovery/test.jpg', evidence_mime:'image/jpeg', evidence_bytes:1, verification_status:'pending', review_status:'pending_review' });
  const originalEnv = globalThis.cloudflareEnv;
  const jpeg = makeSyntheticCertificate({ edited:false });
  globalThis.cloudflareEnv = { CERTIFICATE_VAULT:{ get:async()=>({arrayBuffer:async()=>jpeg,httpMetadata:{contentType:'image/jpeg'}}), put:async()=>{} } };
  try {
    const result = await fraud.processPendingCertificatesDirect(1,{recognizer:async()=> 'RECOVERY STUDENT'});
    assert.equal(result.selected,1);
    assert.equal(result.processed,1);
    const updated = await db.selectOne('certificates',{id:cert.id});
    assert.ok(updated.fraud_processed_at);
  } finally { globalThis.cloudflareEnv = originalEnv; }
});
'''
          p.write_text(s)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Full test suite
        run: npm run check
      - name: Syntax check all application JavaScript
        run: |
          find src worker public/js scripts test -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0 | sort -z | xargs -0 -n1 node --check
      - name: Cloudflare dry run
        run: npm run deploy:dry-run
      - name: Commit tested recovery hotfix
        run: |
          rm .github/workflows/certificate-fraud-runtime-recovery.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/certificateFraudDetection.js worker/index.mjs wrangler.jsonc test/certificate-fraud-detection.test.js .github/workflows/certificate-fraud-runtime-recovery.yml
          git commit -m 'fix: add certificate fraud runtime recovery'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Verify Cloudflare credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'CLOUDFLARE_API_TOKEN is not configured in GitHub Actions.' >&2
            exit 78
          fi
          npx wrangler whoami
      - name: Ensure fraud queue exists
        run: npx wrangler queues create ait-certificate-fraud || true
      - name: Deploy recovery Worker
        run: npx wrangler deploy
